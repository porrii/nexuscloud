name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

# Todo el código Go vive en nexuscloud/ (reestructuración 2026-09-14, ver
# README.md de la raíz) -- working-directory a nivel de job en vez de
# repetirlo en cada "run:" individual.
jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: nexuscloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -cover

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexuscloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "Ficheros sin formatear (ejecuta gofmt -w .):"
            echo "$fmt_out"
            exit 1
          fi

  security-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexuscloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # Fijo, no @latest: una versión reciente de govulncheck ya exige Go
      # 1.26+ (confirmado de verdad: @latest falla con "requires go >=
      # 1.26.0" contra el Go 1.25 que fija este workflow), rompería este
      # job en silencio hasta que alguien lo notara fallar.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck ./...

  # Verifica que el binario cruza a las plataformas objetivo de §60/§63/§64:
  # Linux amd64/arm64 (servidor, Raspberry Pi) y Windows amd64.
  cross-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexuscloud
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o /tmp/nexuscloud ./cmd/nexuscloud

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sin working-directory aquí (ese default es para "run:" de shell,
      # no afecta a "docker build") -- el contexto se pasa explícito.
      - run: docker build -t nexuscloud:ci -f nexuscloud/Dockerfile nexuscloud
