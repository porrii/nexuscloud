name: nexuscloud_client
description: "Cliente de escritorio de NexusCloud."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  get_it: ^9.2.1
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  path: ^1.9.1
  # Directorio de datos de la app para el manifiesto de estado de sync
  # bidireccional (slice 13): getApplicationSupportDirectory(). Ya venía
  # como dependencia transitiva (flutter_secure_storage / shared_preferences)
  # -- aquí solo se promueve a directa porque este slice la usa de forma
  # explícita.
  path_provider: ^2.1.6
  equatable: ^2.1.0
  file_selector: ^1.1.0
  crypto: ^3.0.7
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  # Arrancar con Windows (slice 10): sin el paquete `launch_at_startup` --
  # su única versión publicada fija win32_registry ^2.0.0 (incompatible con
  # el win32 ^6.0.1 que ya exige flutter_secure_storage) y forzar la
  # versión con dependency_overrides no basta, win32_registry 3.x rediseñó
  # por completo la API de RegistryKey (confirmado con flutter test real,
  # no solo flutter analyze). El algoritmo (mismas dos claves de registro,
  # mismo formato) se reimplementa directamente en
  # core/window/launch_at_startup_service.dart contra la API 3.x real.
  win32_registry: ^3.0.3
  # Plugin interno (slice 12): arrancar con Windows cuando la app está
  # empaquetada en MSIX. El registro clásico (win32_registry) se virtualiza
  # bajo MSIX y nunca llega al HKCU real -- confirmado empíricamente. El
  # camino soportado es la StartupTask del manifiesto + la API WinRT
  # Windows.ApplicationModel.StartupTask, que este plugin expone a Dart.
  # LaunchAtStartupService elige registro (suelto) o StartupTask (MSIX).
  nexus_startup_task:
    path: packages/nexus_startup_task

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # Empaqueta el build de release en un instalador MSIX (Fase 3 slice 11):
  # `dart run msix:create` hace `flutter build windows` por su cuenta y
  # produce build\windows\x64\runner\Release\nexuscloud_client.msix.
  msix: ^3.18.0

# Config del instalador MSIX. Sin firmar (`sign_msix: false`) a proposito,
# para una app self-hosted de uso personal: la alternativa (certificado de
# prueba autofirmado) obliga a confiarlo en LocalMachine\TrustedPeople, que
# requiere permisos de administrador en cada maquina. Sin firma, con "Modo
# de desarrollador" de Windows activado, se instala desde los archivos
# sueltos con `Add-AppxPackage -Register <ruta>\AppxManifest.xml` sin
# elevacion ni UAC (o desde el .msix con `Add-AppxPackage -Path <.msix>
# -AllowUnsigned` en Windows 11 / PowerShell reciente).
#   - display_name / publisher_display_name: nombre "bonito" del Menu Inicio
#     y el instalador. NO se toca CompanyName/ProductName de Runner.rc:
#     flutter_secure_storage y path_provider derivan de esos campos la
#     carpeta %APPDATA%\<Company>\<Product>\ -- cambiarlos reubicaria en
#     silencio la sesion y los ajustes.
#   - publisher: obligatorio cuando `sign_msix: false` (es el valor
#     `Publisher` del manifiesto; sin certificado ya no tiene que casar con
#     ningun Subject).
#   - capabilities: solo `internetClient` -- la app solo hace HTTP saliente.
#     `runFullTrust` lo anade `msix` solo (app Win32 empaquetada).
msix_config:
  display_name: NexusCloud
  publisher_display_name: Porrii
  publisher: CN=Porrii
  identity_name: Porrii.NexusCloud
  msix_version: 1.0.0.0
  logo_path: windows/runner/resources/app_icon_512.png
  capabilities: internetClient
  sign_msix: false
  install_certificate: false
  # StartupTask (slice 12): declara la extensión `windows.startupTask` en el
  # manifiesto para poder arrancar con Windows bajo MSIX. `enabled: false` =
  # registrada pero apagada (secure-by-default); la activa el interruptor de
  # Ajustes vía WinRT (plugin nexus_startup_task). El task_id DEBE coincidir
  # con kTaskId de nexus_startup_task_plugin.cpp.
  startup_task:
    task_id: NexusCloudAutostart
    enabled: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Icono de bandeja del sistema (slice 9) -- reutiliza el mismo .ico que ya
  # usa el ejecutable de Windows (Runner.rc, IDI_APP_ICON) en vez de
  # duplicarlo; un asset de Flutter puede apuntar a cualquier ruta del repo.
  assets:
    - windows/runner/resources/app_icon.ico

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
