# Configuración de ejemplo de NexusCloud (§100). Copia este fichero a
# config.yaml y ajústalo, o genera uno con valores por defecto seguros con:
#
#   nexuscloud config init
#
# No pongas secretos reales en un fichero que vaya a commitearse a git.
# Toda opción de aquí también puede fijarse por variable de entorno
# NEXUSCLOUD_* (mayor prioridad) o por flag de CLI (máxima prioridad).

# Versión del esquema de configuración (§151). No la edites a mano.
configVersion: 1

general:
  name: "NexusCloud"
  language: "es"      # es | en
  timezone: "UTC"      # se usa internamente en UTC (§178); esto es solo para la UI futura

server:
  host: "0.0.0.0"
  port: 8080           # NEXUSCLOUD_PORT. Nunca asumas que 8080 está libre (§48)
  # Deja vacíos tlsCertFile/tlsKeyFile para servir HTTP plano (válido en LAN
  # sin Internet, §66). Rellénalos para servir HTTPS directamente sin
  # reverse proxy delante.
  tlsCertFile: ""
  tlsKeyFile: ""
  # IPs/CIDRs de reverse proxies en los que se confía para leer
  # X-Forwarded-For/X-Forwarded-Proto. Vacío por defecto: no te fíes de
  # ningún proxy hasta que lo indiques explícitamente (§50, §118).
  trustedProxies: []

database:
  driver: "sqlite"      # sqlite | postgres | mysql
  # sqlite: si se deja vacío, se usa <storage.dataDir>/database/nexuscloud.db
  # postgres: obligatorio, p.ej. postgres://usuario:password@host:5432/nexuscloud?sslmode=disable
  # mysql: obligatorio, p.ej. usuario:password@tcp(host:3306)/nexuscloud
  #   (MySQL 8.0.16+ o MariaDB 10.2.1+ -- versiones anteriores no aplican
  #   los CHECK constraints del esquema, solo los parsean; no hace falta
  #   añadir "?multiStatements=true" -- NexusCloud lo fuerza internamente
  #   porque lo necesitan las migraciones, ver ADR-031)
  dsn: ""

storage:
  # Directorio raíz de datos de esta instancia (§154): config/database/cache
  # /logs/backups/storage cuelgan de aquí salvo que se reubiquen individualmente.
  dataDir: ""           # vacío = valor por SO (ver defaultDataDir en internal/config)
  storageDir: ""        # vacío = <dataDir>/storage (raíz del pool "default")

  # Cada área de almacenamiento puede vivir en otro disco de forma
  # independiente. Vacío = <dataDir>/<área> (comportamiento por defecto);
  # rellena solo el/los que quieras reubicar. También por variable de
  # entorno: NEXUSCLOUD_DATABASE_DIR, NEXUSCLOUD_CACHE_DIR, etc.
  # Ninguno puede caer dentro de storageDir (mezclaría datos internos con
  # los archivos de usuario; config validate lo rechaza).
  databaseDir: ""       # vacío = <dataDir>/database   (fichero SQLite, si driver=sqlite)
  cacheDir: ""          # vacío = <dataDir>/cache
  thumbnailsDir: ""     # vacío = <dataDir>/thumbnails (miniaturas, cuando se implementen)
  versionsDir: ""       # vacío = <dataDir>/versions   (historial de versiones)
  tempDir: ""           # vacío = <dataDir>/tmp        (temporales de uso general)
  logsDir: ""           # vacío = <dataDir>/logs
  backupsDir: ""        # vacío = <dataDir>/backups
  configDir: ""         # vacío = <dataDir>/config

  # Cuota global de almacenamiento por usuario, en bytes (§24): se aplica a
  # quien no tiene cuota propia ni de grupo. 0 = sin cuota global (por defecto:
  # nadie tiene límite hasta que lo configures). 107374182400 = 100 GiB. Cuenta
  # archivos + papelera + versiones anteriores. También por variable de
  # entorno: NEXUSCLOUD_STORAGE_DEFAULT_QUOTA_BYTES. Cuota de un usuario o de un
  # grupo concreto: `nexuscloud users edit --quota` / `users group edit --quota`.
  # Detalle: docs/administracion.md.
  defaultQuotaBytes: 0

security:
  sessionTTLHours: 720   # 30 días
  argon2:                # §25. Los mismos parámetros de referencia que NexusKeys.
    memoryKiB: 65536      # 64 MiB
    iterations: 3
    parallelism: 4
  rateLimit:              # §27, §77
    loginPerMinute: 5
    apiPerMinute: 300
    publicLinkPerMinute: 20 # enlaces públicos de compartición (§37): objetivo de fuerza bruta sobre su contraseña, igual motivo que loginPerMinute
    webdavPerMinute: 1200   # WebDAV (§43): cubo propio por IP, mucho más holgado que apiPerMinute -- un cliente WebDAV lanza decenas de PROPFIND por segundo
    anonymousUploadPerMinute: 10 # subida anónima (§38, ADR-039): más estricto que publicLinkPerMinute -- aquí cualquiera con el enlace escribe sin que el creador haya podido vetar a nadie
  corsAllowedOrigins: []  # nunca "*" (§69); añade aquí el origen de tu web/futuros clientes
  publicRegistrationEnabled: false   # §21: no cambiar salvo que sepas lo que haces
  # Passkeys / WebAuthn (§25, ADR-033): segundo factor más fuerte que TOTP y
  # login sin contraseña. Desactivado por defecto: sin un dominio real el
  # navegador rechaza cualquier passkey. Con enabled=true, rpID y rpOrigin son
  # obligatorios y rpOrigin debe ser https:// (o http://localhost en desarrollo).
  webAuthn:
    enabled: false
    rpID: ""              # solo el dominio, sin esquema ni puerto: "nexuscloud.tu-dominio.com"
    rpOrigin: ""          # el origen completo de la web: "https://nexuscloud.tu-dominio.com"

# Papelera (§16): con enabled=false, eliminar es inmediato y permanente --
# sin red de seguridad. La purga automática por retención corre en segundo
# plano cada hora.
trash:
  enabled: true
  retentionDays: 30

# Historial de versiones (§15): con enabled=false, subir a un path
# existente sobrescribe sin dejar rastro. Al superar maxVersionsPerFile se
# purga automáticamente la versión más antigua.
versioning:
  enabled: true
  maxVersionsPerFile: 10

# Compartición (§37). enabled cubre usuario→usuario y usuario→grupo --
# siempre autenticadas, no añaden superficie nueva -- por eso van activadas
# por defecto. publicLinksEnabled cubre los enlaces públicos, la ÚNICA
# superficie de Sharing accesible sin sesión: desactivada por defecto
# (secure-by-default, §3/§47), actívala explícitamente si los necesitas.
# anonymousUploadEnabled (§38, ADR-039) es un modelo SEPARADO de los enlaces
# públicos -- enlaces de subida sin ningún acceso al resto del contenido --
# mismo criterio de valor por defecto (false).
sharing:
  enabled: true
  publicLinksEnabled: false
  anonymousUploadEnabled: false

api:
  enabled: true

# Desactivada por defecto (§3, §47): actívala para exponer la interfaz web
# (explorador de archivos, ya implementada). Requiere haber compilado el
# frontend antes (`cd web && npm install && npm run build`) para que el
# binario tenga assets reales que embeber -- ver web/README.md.
web:
  enabled: false

# WebDAV (§43, ADR-034): monta tu espacio como unidad de red o úsalo desde
# clientes estándar (Explorador de Windows, Finder, rclone, Cyberduck...).
# Desactivado por defecto (§3, §169). Se sirve por el mismo puerto que la API,
# bajo `path`. Se autentica con HTTP Basic usando tu usuario y un TOKEN DE
# ACCESO WEBDAV (Cuenta > Acceso WebDAV en la web, o `nexuscloud users
# webdav-token create --username <u>`), nunca con la contraseña de la cuenta:
# así no se salta el segundo factor. Usa HTTPS: Basic envía el token en cada
# petición. Detalle, límites conocidos y guía de clientes: docs/webdav.md.
webdav:
  enabled: false
  path: "/webdav"         # prefijo de URL, sin barra final; no puede colgar de /api, /health ni /ready
  readOnly: false         # true = solo OPTIONS/GET/HEAD/PROPFIND (consultar sin que ningún cliente escriba)
  maxUploadSizeBytes: 0   # 0 = sin límite; si no, rechaza con 413 las subidas mayores

logging:
  level: "info"    # trace | debug | info | warn | error | fatal
  format: "text"   # text | json
  output: "stdout" # "stdout" o una ruta de fichero
