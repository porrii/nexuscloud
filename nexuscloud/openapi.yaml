openapi: 3.0.3
info:
  title: NexusCloud API
  version: "1.0"
  description: >
    API REST de NexusCloud (Fase 1). Ver docs/api.md para ejemplos y
    docs/security.md para el modelo de autenticación/autorización.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /api/v1

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                totp_code: { type: string, description: "Obligatorio si el usuario tiene 2FA activado" }
      responses:
        "200":
          description: Login correcto
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: "Token en claro, se muestra una única vez" }
                  user: { $ref: "#/components/schemas/User" }
                  session: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      summary: Cerrar la sesión actual
      responses:
        "204": { description: Sesión revocada }
        "401": { $ref: "#/components/responses/Error" }

  /auth/sessions:
    get:
      summary: Listar las sesiones activas del usuario autenticado
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }

  /auth/sessions/{id}:
    delete:
      summary: Revocar una sesión propia
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "204": { description: Sesión revocada }
        "404": { $ref: "#/components/responses/Error" }

  /auth/api-tokens:
    get:
      summary: Listar los tokens de API del usuario autenticado (§78, ADR-037)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiToken" }
    post:
      summary: Crear un token de API (alcance todo-o-nada; se muestra una única vez)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiToken"
                  - type: object
                    properties:
                      token: { type: string, description: "Solo aparece aquí; nunca se vuelve a mostrar" }
        "400": { $ref: "#/components/responses/Error" }

  /auth/api-tokens/{id}:
    delete:
      summary: Revocar un token de API propio
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "204": { description: Token revocado }
        "404": { $ref: "#/components/responses/Error" }

  /favorites:
    get:
      summary: Listar los favoritos del usuario autenticado (§87, ADR-038)
      description: Misma forma que GET /files, con favorite_id ya poblado; solo recursos activos.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  directories:
                    type: array
                    items: { $ref: "#/components/schemas/Directory" }
                  files:
                    type: array
                    items: { $ref: "#/components/schemas/File" }
    post:
      summary: Marcar un archivo o carpeta propios como favorito
      description: Idempotente -- favoritar dos veces el mismo recurso devuelve el existente, no un error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource_type, resource_id]
              properties:
                resource_type: { type: string, enum: [file, directory] }
                resource_id: { type: string, format: uuid }
      responses:
        "201":
          description: Creado (o ya existente)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Favorite" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /favorites/{id}:
    delete:
      summary: Quitar un favorito propio
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "204": { description: Favorito quitado }
        "404": { $ref: "#/components/responses/Error" }

  /activity:
    get:
      summary: Actividad reciente del usuario autenticado (§88, ADR-038)
      description: Widget de dashboard ("Recientes") -- subidas/descargas/borrados/movimientos/comparticiones, más reciente primero.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityEvent" }

  /auth/totp/enroll:
    post:
      summary: Generar un secreto TOTP para activar 2FA
      responses:
        "200":
          description: Secreto generado (no persistido hasta /totp/verify)
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  otpauth_url: { type: string }

  /auth/totp/verify:
    post:
      summary: Confirmar el código TOTP y activar 2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret, code]
              properties:
                secret: { type: string }
                code: { type: string }
      responses:
        "204": { description: 2FA activado }
        "400": { $ref: "#/components/responses/Error" }

  /users/me:
    get:
      summary: Usuario autenticado
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /users/me/quota:
    get:
      summary: Uso y límite de almacenamiento de quien pregunta (§24, ADR-036)
      description: >
        El uso es la huella real en disco: archivos activos + papelera +
        versiones anteriores. Se calcula en el momento, así que es más caro que
        /users/me; por eso es un endpoint aparte. limit_bytes se omite si no hay
        límite; source dice de dónde sale el límite efectivo (user, group,
        global o none).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quota" }

  /users:
    get:
      summary: Listar usuarios (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Crear un usuario directamente (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password, minLength: 8 }
                display_name: { type: string }
                email: { type: string }
                role: { type: string, enum: [super_admin, administrator, user, read_only] }
                quota_bytes:
                  type: integer
                  format: int64
                  minimum: 0
                  nullable: true
                  description: "Cuota propia (§24). Ausente o null = hereda del grupo o la global; 0 = ilimitada."
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /users/{id}:
    patch:
      summary: Actualizar un usuario (admin)
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                email: { type: string }
                status: { type: string, enum: [active, disabled] }
                quota_bytes:
                  type: integer
                  format: int64
                  minimum: 0
                  nullable: true
                  description: >
                    Cuota propia (§24, ADR-036), tri-estado: ausente = no se
                    toca; null = sin cuota propia (hereda del grupo o la
                    global); 0 = ilimitada; un número > 0 = límite en bytes.
                    400 si es negativo, decimal o no es un número. Cambiarla
                    se audita como quota_changed.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      summary: Eliminar un usuario (admin, no a sí mismo)
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "204": { description: Eliminado }

  /invitations:
    get:
      summary: Listar invitaciones (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invitation" }
    post:
      summary: Crear una invitación (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string }
                max_uses: { type: integer, minimum: 1, default: 1 }
                ttl_hours: { type: integer, minimum: 1, default: 168 }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitation: { $ref: "#/components/schemas/Invitation" }
                  token: { type: string, description: "Se muestra una única vez" }

  /invitations/{id}:
    delete:
      summary: Revocar una invitación (admin)
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "204": { description: Revocada }

  /invitations/redeem:
    post:
      summary: Canjear una invitación y crear una cuenta (único auto-alta permitido, §21)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, username, password]
              properties:
                token: { type: string }
                username: { type: string }
                password: { type: string, format: password, minLength: 8 }
                display_name: { type: string }
                email: { type: string }
      responses:
        "201":
          description: Cuenta creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { description: "Invitación expirada, agotada o revocada" }

  /files:
    get:
      summary: Listar carpetas y archivos en una ruta lógica
      parameters:
        - name: path
          in: query
          schema: { type: string, default: "/" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  directories:
                    type: array
                    items: { $ref: "#/components/schemas/Directory" }
                  files:
                    type: array
                    items: { $ref: "#/components/schemas/File" }
    post:
      summary: Subir un archivo (cuerpo crudo, streaming)
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
        - name: path
          in: query
          schema: { type: string, default: "/" }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Subido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "400": { $ref: "#/components/responses/Error" }
        "507":
          description: >
            quota_exceeded: no cabe en la cuota del usuario (§24, ADR-036). Con
            Content-Length conocido se rechaza sin leer el cuerpo. Cuenta la
            huella real: archivos + papelera + versiones. 413 sigue siendo el
            límite de tamaño por archivo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /files/{id}:
    get:
      summary: Descargar un archivo (streaming; sin soporte Range todavía)
      description: Funciona también si el archivo está en la papelera, mientras lo pida su propietario.
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Contenido del archivo
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Mover y/o renombrar un archivo (ADR-030, §85)
      description: 'Mismo archivo (mismo id): el historial de versiones y las comparticiones sobreviven intactos. Omitir un campo mantiene su valor actual -- omitir parent_path es "renombrar en el sitio", omitir name es "mover sin renombrar". Nunca sobrescribe un destino ya ocupado.'
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_path: { type: string }
                name: { type: string }
      responses:
        "200":
          description: Movido; devuelve el archivo actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "Ya hay un archivo o carpeta con ese nombre en el destino" }
    delete:
      summary: Eliminar un archivo
      description: Por defecto lo mueve a la papelera (§16); con permanent=true (o si trash.enabled=false) lo borra directamente para siempre.
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: permanent
          in: query
          schema: { type: boolean, default: false }
      responses:
        "204": { description: Eliminado (o movido a la papelera) }
        "403": { $ref: "#/components/responses/Error" }

  /files/{id}/restore:
    post:
      summary: Restaurar un archivo desde la papelera
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "204": { description: Restaurado }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "Ya existe otro elemento con ese nombre en la ruta original" }

  /files/{id}/versions:
    get:
      summary: Listar el historial de versiones de un archivo (§15), más reciente primero
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FileVersion" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /files/{id}/versions/{versionNum}:
    get:
      summary: Descargar el contenido de una versión concreta (no la actual)
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: versionNum
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Contenido de esa versión
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /files/{id}/versions/{versionNum}/restore:
    post:
      summary: Restaurar una versión antigua como contenido actual
      description: La versión que estaba vigente pasa, a su vez, a formar parte del historial -- nunca se pierde contenido al restaurar.
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: versionNum
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Restaurada; devuelve el archivo actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /directories:
    post:
      summary: Crear una carpeta (idempotente)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                parent_path: { type: string, default: "/" }
                name: { type: string }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Directory" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { description: "El nombre está ocupado por un elemento en la papelera" }

  /directories/{id}:
    patch:
      summary: Mover y/o renombrar una carpeta (ADR-030, §85)
      description: Mueve TODO el árbol de descendientes (archivos y subcarpetas, cualquier profundidad) con ella. Omitir un campo mantiene su valor actual, mismo criterio que PATCH /files/{id}. Rechaza mover una carpeta dentro de sí misma o de una de sus propias subcarpetas.
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_path: { type: string }
                name: { type: string }
      responses:
        "200":
          description: Movida; devuelve la carpeta actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Directory" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "Ya hay un archivo o carpeta con ese nombre en el destino" }
    delete:
      summary: Eliminar una carpeta vacía (de contenido activo)
      description: Por defecto la mueve a la papelera (§16); con permanent=true (o si trash.enabled=false) la borra directamente para siempre.
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: permanent
          in: query
          schema: { type: boolean, default: false }
      responses:
        "204": { description: Eliminada (o movida a la papelera) }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "La carpeta no está vacía" }

  /directories/{id}/restore:
    post:
      summary: Restaurar una carpeta desde la papelera (recrea su marcador físico)
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "204": { description: Restaurada }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "Ya existe otro elemento con ese nombre en la ruta original" }

  /trash:
    get:
      summary: Listar la papelera del usuario (vista plana, sin jerarquía)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  directories:
                    type: array
                    items: { $ref: "#/components/schemas/Directory" }
                  files:
                    type: array
                    items: { $ref: "#/components/schemas/File" }

  /groups:
    get:
      summary: Listar grupos (para elegir destino al compartir, §37)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
    post:
      summary: Crear un grupo (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                quota_bytes:
                  type: integer
                  format: int64
                  minimum: 0
                  nullable: true
                  description: "Cuota por miembro (§24). Ausente o null = el grupo no aporta cuota; 0 = ilimitada."
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: "Ya existe un grupo con ese nombre" }

  /groups/{id}:
    patch:
      summary: Fijar la cuota por miembro de un grupo (admin, §24, ADR-036)
      description: >
        De momento es lo único que se puede cambiar de un grupo, así que
        quota_bytes es obligatorio. Es un límite POR MIEMBRO, no un espacio
        compartido: cada miembro puede usar hasta esa cantidad salvo cuota
        propia; con varios grupos con cuota gana la más generosa.
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quota_bytes]
              properties:
                quota_bytes:
                  type: integer
                  format: int64
                  minimum: 0
                  nullable: true
                  description: "null = el grupo deja de aportar cuota; 0 = ilimitada para sus miembros; > 0 = límite en bytes."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /groups/{id}/members:
    post:
      summary: Añadir un usuario a un grupo (admin)
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
      responses:
        "204": { description: "Añadido (idempotente: repetir la misma llamada no falla)" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { description: "El grupo o el usuario no existen" }

  /shares:
    post:
      summary: Crear una compartición usuario/grupo/enlace (§37)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateShareRequest" }
      responses:
        "201":
          description: Creada; token solo presente si share_type=link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Share" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { description: "Compartición o enlaces públicos desactivados en esta instancia" }
    get:
      summary: Listar comparticiones ("compartido por mí" o "compartido conmigo", §143)
      parameters:
        - name: direction
          in: query
          schema: { type: string, enum: [by-me, with-me], default: by-me }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Share" }

  /shares/{id}:
    delete:
      summary: Revocar una compartición (soft, propietario únicamente)
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "204": { description: Revocada }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /shared-directories/{id}:
    get:
      summary: Navegar una carpeta a la que se accede vía share (directo o de un ancestro), no por propiedad
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  directories:
                    type: array
                    items: { $ref: "#/components/schemas/Directory" }
                  files:
                    type: array
                    items: { $ref: "#/components/schemas/File" }
                  can_upload:
                    type: boolean
                    description: Si quien mira puede subir a esta carpeta (permiso de subida, propio o de un grupo suyo, sobre ella o un ancestro; o es su propietario)
                  max_upload_size_bytes:
                    type: integer
                    format: int64
                    description: Límite por archivo que se aplicará a la subida. Ausente si no hay límite o si no puede subir
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /shared-directories/{id}/files:
    post:
      summary: Subir un archivo a una carpeta compartida contigo con permiso de subida (§37, ADR-035)
      description: >
        Cuerpo crudo en streaming, como POST /files. El destino sale solo del
        ID de la carpeta de la URL (la carpeta compartida o cualquiera de sus
        subcarpetas): la autorización se re-deriva de la base de datos en cada
        petición. El archivo queda en el árbol del propietario. No
        sobrescribe un archivo existente: un nombre ya ocupado da 409. Se
        audita como upload con via=shared_directory.
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: name
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Subido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { description: "upload_not_allowed (tiene lectura pero el share no permite subir), forbidden (sin acceso) o sharing_disabled" }
        "404": { description: "Carpeta inexistente o en la papelera" }
        "409": { description: "destination_occupied: ya hay un archivo con ese nombre (o algo suyo en la papelera del propietario, sin distinguirlo)" }
        "413": { description: "upload_too_large: el archivo supera el límite de tamaño del permiso" }
        "507": { description: "quota_exceeded: no cabe en la cuota del PROPIETARIO de la carpeta (los archivos son suyos, ADR-036); el mensaje es genérico y no revela su uso ni su límite" }

  /public/shares/{token}:
    get:
      summary: Metadata de un enlace público (§37)
      description: >
        Sin sesión. Si el enlace tiene contraseña y no llega X-Share-Password
        correcta, la respuesta solo indica requires_password -- nunca
        nombre/tamaño del recurso.
      security: []
      parameters:
        - $ref: "#/components/parameters/tokenParam"
        - $ref: "#/components/parameters/sharePasswordHeader"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicShareInfo" }
        "403": { description: "Enlaces públicos desactivados en esta instancia" }
        "404": { $ref: "#/components/responses/Error" }

  /public/shares/{token}/download:
    get:
      summary: Descargar vía enlace público (streaming)
      description: Incrementa el contador de descargas de forma atómica (§37 "límite de descargas").
      security: []
      parameters:
        - $ref: "#/components/parameters/tokenParam"
        - $ref: "#/components/parameters/sharePasswordHeader"
        - name: path
          in: query
          description: Ruta relativa a la raíz compartida (solo para un enlace de carpeta)
          schema: { type: string }
      responses:
        "200":
          description: Contenido del archivo
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { description: "Contraseña requerida o incorrecta" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { description: "Enlace revocado, expirado o agotado" }

  /public/shares/{token}/browse:
    get:
      summary: Listar el contenido de un enlace de carpeta (o una subcarpeta suya)
      security: []
      parameters:
        - $ref: "#/components/parameters/tokenParam"
        - $ref: "#/components/parameters/sharePasswordHeader"
        - name: path
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  directories:
                    type: array
                    items: { $ref: "#/components/schemas/Directory" }
                  files:
                    type: array
                    items: { $ref: "#/components/schemas/File" }
        "401": { description: "Contraseña requerida o incorrecta" }
        "410": { description: "Enlace revocado, expirado o agotado" }

  /public/shares/{token}/upload:
    post:
      summary: Subir a un enlace de carpeta con permiso de subida (§37 "Subida")
      security: []
      parameters:
        - $ref: "#/components/parameters/tokenParam"
        - $ref: "#/components/parameters/sharePasswordHeader"
        - name: path
          in: query
          description: Subcarpeta destino relativa a la raíz compartida
          schema: { type: string }
        - name: name
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Subido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "401": { description: "Contraseña requerida o incorrecta" }
        "403": { description: "El enlace no permite subida" }
        "409": { description: "destination_occupied: ya hay un archivo con ese nombre en la carpeta (o algo suyo en la papelera del propietario, sin distinguirlo); no se sobrescribe" }
        "410": { description: "Enlace revocado, expirado o agotado" }
        "413": { description: "El archivo supera el límite de tamaño del enlace" }
        "507": { description: "quota_exceeded: no cabe en la cuota del propietario del enlace (ADR-036); el mensaje es genérico y no revela su uso ni su límite" }

  /public/client-updates/releases.json:
    get:
      summary: Feed de actualizaciones del cliente de escritorio (Velopack, ADR-032)
      description: >
        Sin sesión, a propósito (instalar/actualizar debe funcionar antes de
        poder haber iniciado sesión). Reenvía releases.<channel>.json desde
        GitHub Releases del propio proyecto -- el cliente nunca habla con
        GitHub directamente ni lleva ningún token propio. Solo existe si
        clientUpdates.enabled=true en esta instancia.
      security: []
      responses:
        "200":
          description: Feed JSON de Velopack, tal cual lo publicó "vpk upload github"
          content:
            application/json:
              schema: { type: object }
        "404": { description: "clientUpdates.enabled=false en esta instancia" }
        "502": { $ref: "#/components/responses/Error" }

  /public/client-updates/download/{assetName}:
    get:
      summary: Descargar un asset exacto de esa misma release (ADR-032)
      description: >
        assetName debe coincidir EXACTO con un asset real de la última
        release resuelta -- nunca una URL o ruta arbitraria, para que esto
        no se pueda usar para pedirle a GitHub cualquier otro fichero del
        repositorio.
      security: []
      parameters:
        - name: assetName
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Contenido del asset (paquete o instalador)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: "clientUpdates.enabled=false, o ese asset no existe en la última release" }
        "502": { $ref: "#/components/responses/Error" }

  /audit:
    get:
      summary: Listar eventos de auditoría (admin)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEvent" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Token devuelto por /auth/login. También aceptado como cookie
        HttpOnly "nexuscloud_session" (mismo valor).

  parameters:
    idParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    tokenParam:
      name: token
      in: path
      required: true
      schema: { type: string }
      description: Token en claro del enlace público (256 bits, base64url)
    sharePasswordHeader:
      name: X-Share-Password
      in: header
      required: false
      schema: { type: string }
      description: >
        Contraseña del enlace, si tiene. Nunca en la query string (evita
        que quede en logs/historial/Referer).

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        email: { type: string }
        status: { type: string, enum: [active, disabled] }
        has_totp: { type: boolean }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }
        quota_bytes:
          type: integer
          format: int64
          description: "Cuota PROPIA del usuario (§24, ADR-036). Ausente = hereda del grupo o la global; 0 = ilimitada. El límite efectivo y el uso salen de GET /users/me/quota."

    Quota:
      type: object
      description: Uso y límite de almacenamiento de un usuario (§24, ADR-036).
      properties:
        used_bytes: { type: integer, format: int64, description: "Huella total: files_bytes + trash_bytes + versions_bytes" }
        files_bytes: { type: integer, format: int64 }
        trash_bytes: { type: integer, format: int64 }
        versions_bytes: { type: integer, format: int64 }
        limit_bytes: { type: integer, format: int64, description: "Ausente si no tiene límite" }
        source: { type: string, enum: [user, group, global, none], description: "De dónde sale el límite efectivo" }
        group_name: { type: string, description: "El grupo que da el límite, si source=group" }

    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        device: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    ApiToken:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }

    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        role_id: { type: string }
        max_uses: { type: integer }
        use_count: { type: integer }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        used_at: { type: string, format: date-time, nullable: true }
        revoked: { type: boolean }

    FileVersion:
      type: object
      properties:
        version_num: { type: integer }
        size_bytes: { type: integer, format: int64 }
        sha256: { type: string }
        mime_type: { type: string }
        created_at: { type: string, format: date-time }

    Directory:
      type: object
      properties:
        id: { type: string, format: uuid }
        parent_path: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true, description: "Presente solo si está en la papelera (§16)" }
        favorite_id: { type: string, format: uuid, nullable: true, description: "Presente si está en favoritos (§87, ADR-038); solo en GET /files" }

    File:
      type: object
      properties:
        id: { type: string, format: uuid }
        parent_path: { type: string }
        name: { type: string }
        size_bytes: { type: integer, format: int64 }
        sha256: { type: string }
        mime_type: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true, description: "Presente solo si está en la papelera (§16)" }
        favorite_id: { type: string, format: uuid, nullable: true, description: "Presente si está en favoritos (§87, ADR-038); solo en GET /files" }

    Favorite:
      type: object
      properties:
        id: { type: string, format: uuid }
        resource_type: { type: string, enum: [file, directory] }
        resource_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    ActivityEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        event_type: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        metadata: { type: object, additionalProperties: true }

    Group:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        quota_bytes:
          type: integer
          format: int64
          description: "Cuota por miembro del grupo (§24, ADR-036). Ausente = el grupo no aporta cuota; 0 = ilimitada para sus miembros."

    CreateShareRequest:
      type: object
      required: [resource_type, resource_id, share_type]
      properties:
        resource_type: { type: string, enum: [file, directory] }
        resource_id: { type: string, format: uuid }
        share_type: { type: string, enum: [user, group, link] }
        target_username: { type: string, description: "Obligatorio si share_type=user" }
        target_group_id: { type: string, format: uuid, description: "Obligatorio si share_type=group" }
        label: { type: string, description: "Nombre personalizado del enlace (§37), cosmético" }
        can_download: { type: boolean, default: true }
        can_upload: { type: boolean, default: false, description: "Exige resource_type=directory. Con share_type=user|group da permiso de «lectura y subida» y exige can_download=true (ADR-035); con share_type=link, permiso de subida al enlace de carpeta" }
        password: { type: string, format: password, description: "Solo enlaces" }
        expires_at: { type: string, format: date-time }
        max_downloads: { type: integer, minimum: 1 }
        max_upload_size_bytes: { type: integer, format: int64, minimum: 1 }

    Share:
      type: object
      properties:
        id: { type: string, format: uuid }
        resource_type: { type: string, enum: [file, directory] }
        resource_id: { type: string, format: uuid }
        resource_name: { type: string }
        share_type: { type: string, enum: [user, group, link] }
        target_user_id: { type: string, format: uuid }
        target_username: { type: string }
        target_group_id: { type: string, format: uuid }
        target_group_name: { type: string }
        label: { type: string }
        can_download: { type: boolean }
        can_upload: { type: boolean }
        has_password: { type: boolean }
        expires_at: { type: string, format: date-time, nullable: true }
        max_downloads: { type: integer, nullable: true }
        download_count: { type: integer }
        max_upload_size_bytes: { type: integer, format: int64, nullable: true }
        created_at: { type: string, format: date-time }
        token: { type: string, description: "Solo presente en la respuesta de creación de un enlace, una única vez (§78)" }

    PublicShareInfo:
      type: object
      properties:
        requires_password: { type: boolean }
        password_incorrect: { type: boolean }
        revoked: { type: boolean }
        expired: { type: boolean }
        exhausted: { type: boolean }
        resource_type: { type: string, enum: [file, directory] }
        name: { type: string }
        size_bytes: { type: integer, format: int64 }
        can_download: { type: boolean }
        can_upload: { type: boolean }
        label: { type: string }

    AuditEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        actor_user_id: { type: string, nullable: true }
        event_type: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        ip: { type: string }
        metadata: { type: object, additionalProperties: true }
