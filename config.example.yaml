# Configuración de ejemplo de NexusCloud (§100). Copia este fichero a
# config.yaml y ajústalo, o genera uno con valores por defecto seguros con:
#
#   nexuscloud config init
#
# No pongas secretos reales en un fichero que vaya a commitearse a git.
# Toda opción de aquí también puede fijarse por variable de entorno
# NEXUSCLOUD_* (mayor prioridad) o por flag de CLI (máxima prioridad).

# Versión del esquema de configuración (§151). No la edites a mano.
configVersion: 1

general:
  name: "NexusCloud"
  language: "es"      # es | en
  timezone: "UTC"      # se usa internamente en UTC (§178); esto es solo para la UI futura

server:
  host: "0.0.0.0"
  port: 8080           # NEXUSCLOUD_PORT. Nunca asumas que 8080 está libre (§48)
  # Deja vacíos tlsCertFile/tlsKeyFile para servir HTTP plano (válido en LAN
  # sin Internet, §66). Rellénalos para servir HTTPS directamente sin
  # reverse proxy delante.
  tlsCertFile: ""
  tlsKeyFile: ""
  # IPs/CIDRs de reverse proxies en los que se confía para leer
  # X-Forwarded-For/X-Forwarded-Proto. Vacío por defecto: no te fíes de
  # ningún proxy hasta que lo indiques explícitamente (§50, §118).
  trustedProxies: []

database:
  driver: "sqlite"      # sqlite | postgres
  # sqlite: si se deja vacío, se usa <storage.dataDir>/database/nexuscloud.db
  # postgres: obligatorio, p.ej. postgres://usuario:password@host:5432/nexuscloud?sslmode=disable
  dsn: ""

storage:
  # Directorio raíz de datos de esta instancia (§154): config/database/cache
  # /logs/backups/storage cuelgan de aquí salvo que se reubiquen individualmente.
  dataDir: ""           # vacío = valor por SO (ver defaultDataDir en internal/config)
  storageDir: ""        # vacío = <dataDir>/storage (raíz del pool "default")

security:
  sessionTTLHours: 720   # 30 días
  argon2:                # §25. Los mismos parámetros de referencia que NexusKeys.
    memoryKiB: 65536      # 64 MiB
    iterations: 3
    parallelism: 4
  rateLimit:              # §27, §77
    loginPerMinute: 5
    apiPerMinute: 300
  corsAllowedOrigins: []  # nunca "*" (§69); añade aquí el origen de tu web/futuros clientes
  publicRegistrationEnabled: false   # §21: no cambiar salvo que sepas lo que haces

api:
  enabled: true

# Desactivada por defecto (§3, §47): actívala solo cuando quieras exponer
# la interfaz web de NexusCloud (disponible a partir de la Fase 2).
web:
  enabled: false

logging:
  level: "info"    # trace | debug | info | warn | error | fatal
  format: "text"   # text | json
  output: "stdout" # "stdout" o una ruta de fichero
